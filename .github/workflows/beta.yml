name: Beta

on:
  push:
    tags:
      - beta_*
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:

  check:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Install linux deps
        run: sudo apt-get update; sudo apt-get install --no-install-recommends pkg-config build-essential gcc-multilib libudev-dev libjack-jackd2-dev libjack-jackd2-0 libasound2-dev

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy -p eb_agb_psg_cli -p eb_agb_psg_interop -p eb_agb_psg_format -p eb_agb_psg_macros --features eb_agb_psg_interop/parse,eb_agb_psg_interop/quote --all-targets
      - name: test
        run: | 
          cargo test -p eb_agb_psg_interop --features parse,quote
          cargo test -p eb_agb_psg_format
          cargo test -p eb_agb_psg_macros

