  publish_cli:
    if: startsWith(github.ref, 'refs/tags/beta')
    name: Publish CLI
    needs: [ check ]
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: psg_cli_linux.tar.gz
          - target: aarch64-apple-darwin
            os: macOS-latest
            name: psg_cli_arm_mac.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: psg_cli_windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update; sudo apt-get install --no-install-recommends pkg-config build-essential gcc-multilib libudev-dev libjack-jackd2-dev libjack-jackd2-0 libasound2-dev alsa

      - name: build
        run: cargo build --release --target ${{ matrix.target }} --package eb_agb_psg_cli

      - name: Prepare build artifacts [Windows]
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          mv eb_agb_psg_cli.exe psg_cli.exe
          7z a ../../../${{ matrix.name }} psg_cli.exe
          cd -
      - name: Prepare build artifacts [-nix]
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          strip eb_agb_psg_cli
          mv eb_agb_psg_cli psg_cli
          tar czf ../../../${{ matrix.name }} psg_cli
          cd -
      - uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}