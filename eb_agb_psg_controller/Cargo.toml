[package]
name = "eb_agb_psg_controller"
description = "Music and sound effect player for the GBA PSG"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["games", "audio", "retro", "gba", "psg"]
categories = ["games", "no-std"]
publish = true

[features]
default = []
dynamic = []
serde = ["eb_agb_psg_interop/serde"]
# Swaps the register layer for an in-memory shadow + write log so Player runs
# on the host (used by eb_agb_psg_cli). Never enable in a GBA build.
host = []

[[example]]
name = "dynamic_sfx"
required-features = ["dynamic"]

[dependencies]
agb_fixnum.workspace = true
eb_agb_psg_macros = { version = "0.26.0", path = "../eb_agb_psg_macros" }
eb_agb_psg_interop = { version = "0.26.0", path = "../eb_agb_psg_interop" }

[target.'cfg(target_arch = "arm")'.dependencies]
agb = "0.25.0"
